[project]
name = "plpgsql-modernizer"
version = "0.1.0"
description = "Hybrid PL/pgSQL -> Python 3.14 modernization pipeline orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi>=0.142",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",  # serves the graph + the FastAPI routes (langgraph.json)
    "openai>=3.22",
    "pglast>=8.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "ruff>=0.16.9",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a reachable PostgreSQL (TEST_DATABASE_URL)",
]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations/versions", "examples/results"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "ASYNC", # async pitfalls
    "S608",  # SQL built with string formatting
    "RUF",   # ruff-specific
]
ignore = [
    "RUF001", # ambiguous unicode in strings (portuguese text is fine)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.ruff.format]
quote-style = "double"
