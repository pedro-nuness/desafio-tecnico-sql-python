name: plpgsql-modernizer

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://modernizer:modernizer@postgres:5432/modernizer
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  LLM_MODEL: ${LLM_MODEL:-z-ai/glm-5.3-flash}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  # Multi-provider gateway: LLM_CONFIG_FILE=config/llm.yml (mounted below) + the keys it names.
  LLM_CONFIG_FILE: ${LLM_CONFIG_FILE:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-http://host.docker.internal:3000}
  # Evaluation metric (AD-16): runs generated code, so it gets its own throwaway database.
  EVALUATION_DATABASE_URL: postgresql+asyncpg://modernizer:modernizer@postgres:5432/modernizer_eval

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modernizer
      POSTGRES_PASSWORD: modernizer
      POSTGRES_DB: modernizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernizer -d modernizer"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: the app only starts after the schema is at `head`.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-env
    volumes:
      - ./config:/app/config:ro      # LLM gateway YAML: edit without rebuilding the image
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
