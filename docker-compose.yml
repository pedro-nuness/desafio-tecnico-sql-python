name: plpgsql-modernizer

# Configuration comes from .env (copy .env.example), passed to the containers as environment.
# Only the addresses that differ inside the container are set here.
x-app-env-file: &app-env-file
  - path: .env
    required: true

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://modernizer:modernizer@postgres:5432/modernizer
  # Runs generated code, so it gets its own throwaway database.
  EVALUATION_DATABASE_URL: postgresql+asyncpg://modernizer:modernizer@postgres:5432/modernizer_eval
  LANGFUSE_BASE_URL: http://host.docker.internal:3000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: modernizer
      POSTGRES_PASSWORD: modernizer
      POSTGRES_DB: modernizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernizer -d modernizer"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: the app only starts after the schema is at `head`.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: *app-env-file
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *app-env-file
    environment: *app-env
    volumes:
      - ./config:/app/config:ro      # LLM gateway YAML: edit without rebuilding the image
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
